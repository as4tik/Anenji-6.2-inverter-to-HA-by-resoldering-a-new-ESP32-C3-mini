esphome:
  name: anenji
  friendly_name: Anenji

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret anenji_api_key

uart:
  - id: anenji_uart
    baud_rate: 9600
    tx_pin: GPIO21
    rx_pin: GPIO20
    rx_buffer_size: 512


ota:
  - platform: esphome
    password: !secret anenji_ota_key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Anenji Fallback Hotspot"
    password: !secret anenji_ap_pass

captive_portal:
    

web_server:
  port: 80

time:
  - platform: sntp
    id: sntp_time
    timezone: Europe/Kyiv

modbus:
  - id: anenji_modbus
    uart_id: anenji_uart
    send_wait_time: 350ms

modbus_controller:
  - id: smg0
    address: 0x01
    modbus_id: anenji_modbus
    command_throttle: 130ms
    update_interval: 6s

select:
  - platform: modbus_controller
    modbus_controller_id: smg0
    id: smg_input_voltage_range
    name: "input voltage range"
    use_write_multiple: true
    address: 302
    value_type: U_WORD
    optionsmap:
      "Apply": 0
      "UPS": 1
      "GEN": 2

  # - platform: modbus_controller
  #   modbus_controller_id: smg0
  #   id: battery_type_select
  #   name: "battery type"
  #   use_write_multiple: true
  #   address: 322
  #   value_type: U_WORD
  #   optionsmap:
  #     "AGM": 0
  #     "FLD": 1
  #     "User": 2
  #     #"Li_1": 3
  #     "Li_2": 4
  #     #"Li_3": 5
  #     "Li_4": 6

  # Output priority                                               Uint  301 1 R/W 0: Utility-PV-Battery, 1: PV-Utility-Battery, 2: PV-Battery-Utility
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "output priority"
    id: smg_output_priority
    use_write_multiple: true
    address: 301
    value_type: U_WORD
    optionsmap:
      "UTI": 0
      "SOL": 1
      "SBU": 2
      "SUB": 3
      "SUF": 4

  # Battery charging priority                                     Uint  331 1 R/W 0: Utility priority, 1: PV priority, 2: PV is at the same level as the Utility, 3: Only PV charging is allowed
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "battery charging priority"
    use_write_multiple: true
    address: 331
    value_type: U_WORD
    optionsmap:
      #"Utility priority": 0
      "PV priority": 1
      "PV is at the same level as the Utility": 2
      "Only PV charging is allowed": 3

  # Turn on mode                                                  Uint  406 1 R/W 0: Can be turn-on locally or remotely, 1: Only local turn-on, 2: Only remote turn-on
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "turn on mode"
    use_write_multiple: true
    address: 406
    value_type: U_WORD
    optionsmap:
      "Local and remotely turn-on allowed": 0
      "Local turn-on only": 1
      "Remote turn-on only": 2



number:
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "max pv power"
    address: 344
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "W"
    device_class: power
    min_value: 0
    max_value: 4200
    step: 1
    use_write_multiple: true

  # Max charging voltage                                          0.1V    Uint  324 1 R/W
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "max charging voltage"
    use_write_multiple: true
    address: 324
    register_type: holding
    value_type: U_WORD
    min_value: 0.0
    max_value: 100.0
    step: 0.1
    unit_of_measurement: "V"
    lambda: "return x * 0.1f;"
    write_lambda: |-
      return x * 10.0f;

  # Floating charging voltage                                     0.1V    Uint  325 1 R/W
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "floating charging voltage"
    use_write_multiple: true
    address: 325
    register_type: holding
    value_type: U_WORD
    min_value: 0.0
    # max_value: 100.0
    step: 0.1
    unit_of_measurement: "V"
    lambda: "return x * 0.1f;"
    write_lambda: |-
      return x * 10.0f;

  # Battery discharge recovery point in mains mode                0.1V    Uint  326 1 R/W
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "battery discharge recovery point in mains mode"
    use_write_multiple: true
    address: 326
    register_type: holding
    value_type: U_WORD
    min_value: 0.0
    # max_value: 100.0
    step: 0.1
    unit_of_measurement: "V"
    lambda: "return x * 0.1f;"
    write_lambda: |-
      return x * 10.0f;

  # Battery low voltage protection point in mains mode            0.1V    Uint  327 1 R/W
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "battery low voltage protection point in mains mode"
    use_write_multiple: true
    address: 327
    register_type: holding
    value_type: U_WORD
    min_value: 0.0
    # max_value: 100.0
    step: 0.1
    unit_of_measurement: "V"
    lambda: "return x * 0.1f;"
    write_lambda: |-
      return x * 10.0f;

  # Battery low voltage protection point in off-grid mode          0.1V           Uint  329 1 R/W
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "battery low voltage protection point in off-grid mode"
    use_write_multiple: true
    address: 329
    register_type: holding
    value_type: U_WORD
    min_value: 0.0
    # max_value: 100.0
    step: 0.1
    unit_of_measurement: "V"
    lambda: "return x * 0.1f;"
    write_lambda: |-
      return x * 10.0f;

  # Maximum charging current                                      0.1A    Uint  332 1 R/W
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "maximum charging current"
    use_write_multiple: true
    address: 332
    register_type: holding
    value_type: U_WORD
    min_value: 0.0
    max_value: 100.0
    step: 0.1
    unit_of_measurement: "A"
    lambda: "return x * 0.1f;"
    write_lambda: |-
      return x * 10.0f;

  # Maximum mains charging current                                0.1A    Uint  333 1 R/W
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "maximum mains charging current"
    use_write_multiple: true
    address: 333
    register_type: holding
    value_type: U_WORD
    min_value: 0.0
    max_value: 100.0
    step: 0.1
    unit_of_measurement: "A"
    lambda: "return x * 0.1f;"
    write_lambda: |-
      return x * 10.0f;

  # Two equalization charging intervals                           day     Uint  337 1 R/W Range: 1~90
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "two equalization charging intervals"
    use_write_multiple: true
    address: 337
    register_type: holding
    value_type: U_WORD
    min_value: 0.0
    max_value: 90.0
    step: 1
    unit_of_measurement: "day"

  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "Protect Go to SUB"
    use_write_multiple: true
    address: 341
    register_type: holding
    value_type: U_WORD
    min_value: 5.0
    max_value: 50.0
    step: 1
    unit_of_measurement: "%"

  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "Protect return to SBU"
    use_write_multiple: true
    address: 342
    register_type: holding
    value_type: U_WORD
    min_value: 50.0
    max_value: 100.0
    step: 1
    unit_of_measurement: "%"

  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "AC затримка"
    use_write_multiple: true
    address: 355
    register_type: holding
    value_type: U_WORD
    step: 5
    min_value: 5
    max_value: 300
    unit_of_measurement: "s"



sensor:
  - platform: total_daily_energy
    name: "PV energy today"
    restore: true
    icon: mdi:counter
    power_id: smg0_pv_average_power
    filters:
      # Multiplication factor from W to kW is 0.001
      - multiply: 0.001
    unit_of_measurement: kWh

  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "average mains power"
    address: 204
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: Wh
    device_class: power
    state_class: measurement
    accuracy_decimals: 0

  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "AC power"
    address: 208
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: Wh
    device_class: power
    state_class: measurement
    accuracy_decimals: 0

  # Warning code                                                  ULong 108 2 R
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "warning code"
    address: 108
    register_type: holding
    value_type: U_DWORD
    accuracy_decimals: 0

  # Effective mains voltage                              0.1V     Int   202 1 R
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "ac voltage"
    address: 202
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    register_count: 32
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  # Mains Frequency                                      0.01Hz   Int   203 1 R
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "ac frequency"
    address: 203
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "Hz"
    device_class: frequency
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - multiply: 0.01

  # Effective inverter current                           0.1A     Int   206 1 R
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "effective inverter current"
    address: 206
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  # Inverter charging power                              1W       Int   209 1 R
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "inverter charging power"
    address: 209
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "W"
